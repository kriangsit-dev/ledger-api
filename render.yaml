# Render Blueprint — the deployment described in code rather than in dashboard clicks.
#
# Values marked `sync: false` are secrets: Render prompts for them once and never stores them in
# this repository. The database lives on Neon rather than Render because Render's own free
# PostgreSQL expires after 30 days, which is no use for something meant to stay linkable.

services:
  - type: web
    name: ledger-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # A single free instance owns the database, so migrating on boot is safe here.
      - key: Database__ApplyMigrationsOnStartup
        value: "true"

      # Neon connection string, pasted once into the Render dashboard.
      - key: ConnectionStrings__Ledger
        sync: false

      # Generated by Render. The app refuses to start if it is shorter than 32 characters or if it
      # is still the sample key from appsettings.Development.json.
      - key: Auth__SigningKey
        generateValue: true

      # Generated too. A human-chosen demo password is the weakest link in an otherwise careful
      # setup; the values are readable in the Render dashboard when the client needs configuring.
      - key: Auth__Clients__0__ClientId
        value: demo-writer
      - key: Auth__Clients__0__ClientSecret
        generateValue: true
      - key: Auth__Clients__0__Scopes__0
        value: ledger.read
      - key: Auth__Clients__0__Scopes__1
        value: ledger.write

      - key: Auth__Clients__1__ClientId
        value: demo-reader
      - key: Auth__Clients__1__ClientSecret
        generateValue: true
      - key: Auth__Clients__1__Scopes__0
        value: ledger.read

      # Only the portfolio origin may call this from a browser.
      - key: Cors__AllowedOrigins__0
        value: https://kriangsit-dev.github.io
